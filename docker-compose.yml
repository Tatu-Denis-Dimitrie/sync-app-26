services:
  api:
    build:
      context: ./SyncApp26
      dockerfile: SyncApp26.API/Dockerfile
    image: syncapp26-api:local
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/SyncApp26.db;Mode=ReadWriteCreate"
      # No TLS anywhere in this stack — a Secure cookie set over plain HTTP is silently dropped by
      # the browser, so this must be forced off here regardless of ASPNETCORE_ENVIRONMENT. Flip to
      # "true" once a TLS-terminating layer is added in front of this stack.
      Auth__Cookie__Secure: "false"
    volumes:
      - syncapp26_db_data:/app/data
      - syncapp26_logs:/app/logs
    networks:
      - syncapp26_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./SyncApp26/SyncApp26.Client
    image: syncapp26-frontend:local
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - syncapp26_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  syncapp26_net:
    driver: bridge

volumes:
  syncapp26_db_data:
  syncapp26_logs:
