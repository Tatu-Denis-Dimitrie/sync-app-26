services:
  api:
    build:
      context: ./SyncApp26
      dockerfile: SyncApp26.API/Dockerfile
    image: syncapp26-api:local
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/SyncApp26.db;Mode=ReadWriteCreate"
      # No TLS by default; set AUTH_COOKIE_SECURE=true in .env once TLS is added.
      Auth__Cookie__Secure: ${AUTH_COOKIE_SECURE:-false}
    volumes:
      - syncapp26_db_data:/app/data
      - syncapp26_logs:/app/logs
    networks:
      - syncapp26_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./SyncApp26/SyncApp26.Client
    image: syncapp26-frontend:local
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - syncapp26_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Cloudflare Tunnel (2 replicas for HA). Hostname routing is configured in the Cloudflare dashboard.
  cloudflared-1:
    image: cloudflare/cloudflared:2026.7.2
    container_name: syncapp26-tunnel-1
    command: tunnel --no-autoupdate --ha-connections 4 --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - syncapp26_net
    restart: unless-stopped

  cloudflared-2:
    image: cloudflare/cloudflared:2026.7.2
    container_name: syncapp26-tunnel-2
    command: tunnel --no-autoupdate --ha-connections 4 --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - syncapp26_net
    restart: unless-stopped

networks:
  syncapp26_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16

volumes:
  syncapp26_db_data:
  syncapp26_logs:
