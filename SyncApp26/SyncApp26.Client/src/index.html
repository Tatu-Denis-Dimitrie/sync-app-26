<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SyncApp26Client</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- httpOnly cookies stop a token from being stolen, not a script from acting as the user - CSP
       is what prevents the injection in the first place. Set here because the API does not serve
       this page. 'unsafe-inline' on styles is required by Angular's runtime style injection.
       frame-ancestors is ignored in a meta tag - the SPA host must send it as a header. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://accounts.google.com;
    style-src 'self' 'unsafe-inline' https://accounts.google.com;
    img-src 'self' data: https://accounts.google.com https://*.googleusercontent.com;
    font-src 'self' data:;
    connect-src 'self' https://login.microsoftonline.com https://accounts.google.com;
    frame-src https://accounts.google.com https://login.microsoftonline.com;
    base-uri 'self';
    form-action 'self';
    object-src 'none'">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
