<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1 class="login-title">SyncApp26</h1>
      <p class="login-subtitle">Sign in to your account</p>
    </div>

    <form class="login-form" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"          class="form-input"
          placeholder="Enter your email"
          autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="password-field">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              name="password"
              [(ngModel)]="password"
              class="form-input"
              placeholder="Enter your password"
              autocomplete="current-password"
              />
            <button
              type="button"
              class="password-toggle"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              @if (!showPassword) {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
              } @else {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.774 3.162 10.066 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243" />
                </svg>
              }
            </button>
          </div>
        </div>

          @if (errorMessage) {
            <div class="error-message">
              {{ errorMessage }}
            </div>
          }

          <div class="forgot-password-link">
            <a routerLink="/forgot-password" class="link">Forgot Password?</a>
          </div>

          <button type="submit" class="login-button" [disabled]="isLoading">
            @if (!isLoading) {
              <span>Sign In</span>
            }
            @if (isLoading) {
              <span>Signing in...</span>
            }
          </button>
        </form>

        <div class="login-divider">
          <span>or</span>
        </div>

        <div #googleButton class="google-button-host"></div>

        @if (isMicrosoftEnabled) {
          <button type="button" class="microsoft-button" [disabled]="isLoading" (click)="onMicrosoftLogin()">
            <svg class="microsoft-logo" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="1" y="1" width="9" height="9" fill="#F25022" />
              <rect x="11" y="1" width="9" height="9" fill="#7FBA00" />
              <rect x="1" y="11" width="9" height="9" fill="#00A4EF" />
              <rect x="11" y="11" width="9" height="9" fill="#FFB900" />
            </svg>
            <span>Sign in with Microsoft</span>
          </button>
        }

        <div class="login-footer">
          <p class="footer-text">SyncApp26 - User Management System</p>
          <p class="footer-link">
            Don't have an account? <a routerLink="/register" class="link">Register here</a>
          </p>
        </div>
      </div>
    </div>
