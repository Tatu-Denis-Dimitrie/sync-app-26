<div class="relative">
  <button type="button" (click)="toggle()"
    class="flex h-10 items-center gap-1.5 rounded-lg border border-white/10 bg-white/5 px-3 text-xs font-semibold uppercase tracking-wide text-muted-foreground transition-all hover:bg-white/10 hover:text-foreground focus:outline-none backdrop-blur-sm"
    [class.ring-2]="isOpen" [class.ring-primary]="isOpen"
    aria-haspopup="true" [attr.aria-expanded]="isOpen"
    [attr.aria-label]="'Language: ' + labels[currentLanguage]">
    {{ currentLanguage }}
    <svg class="h-3.5 w-3.5 transition-transform" [class.rotate-180]="isOpen" fill="none" stroke="currentColor"
      stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  @if (isOpen) {
    <div
      class="absolute right-0 mt-2 w-40 origin-top-right rounded-2xl border border-white/10 bg-background/95 p-2 shadow-xl backdrop-blur-2xl animate-in fade-in zoom-in duration-200">
      @for (lang of languages; track lang) {
        <button type="button" (click)="select(lang)"
          class="flex w-full items-center justify-between rounded-lg px-3 py-2 text-left text-sm font-medium transition-all hover:bg-white/5"
          [class.text-primary]="lang === currentLanguage"
          [class.text-foreground]="lang !== currentLanguage">
          {{ labels[lang] }}
          @if (lang === currentLanguage) {
            <svg class="h-4 w-4 shrink-0 text-primary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          }
        </button>
      }
    </div>
  }
</div>
