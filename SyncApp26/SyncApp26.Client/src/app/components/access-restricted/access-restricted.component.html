<div class="restricted-container">
  <div class="restricted-card">
    <div class="icon-container">
      <svg
        class="lock-icon"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
        ></path>
      </svg>
    </div>

    <h1 class="title">{{ 'accessRestricted.title' | translate:'Common' }}</h1>

    @if (currentUser) {
      <div class="user-info">
        <p class="greeting">
          {{ 'accessRestricted.greeting' | translate:'Common' }}
          <strong>{{ currentUser.firstName }} {{ currentUser.lastName }}</strong>
        </p>
        <p class="role-badge">
          <span class="badge">{{ rolesLabel(currentUser.roles) }}</span>
        </p>
      </div>
    }

    <p class="message" [innerHTML]="tCommon('accessRestricted.message')"></p>

    <div class="info-box">
      <svg
        class="info-icon"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
        ></path>
      </svg>
      <div class="info-text">
        <p class="info-title">{{ 'accessRestricted.devInProgressTitle' | translate:'Common' }}</p>
        <p class="info-description" [innerHTML]="tCommon('accessRestricted.devInProgressDescription')"></p>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="logout-button" (click)="onLogout()">
        {{ 'buttons.logout' | translate:'Common' }}
      </button>
    </div>
  </div>
</div>
