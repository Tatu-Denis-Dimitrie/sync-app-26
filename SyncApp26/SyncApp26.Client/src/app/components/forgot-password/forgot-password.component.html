<div class="forgot-password-container">
  <div class="forgot-password-card">
    <div class="card-header">
      <h1 class="title">{{ 'forgotPassword.title' | translate:'Auth' }}</h1>
      <p class="subtitle">
        {{ 'forgotPassword.subtitle' | translate:'Auth' }}
      </p>
    </div>

    <form class="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email" class="form-label">{{ 'forgotPassword.email' | translate:'Auth' }}</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          class="form-input"
          [placeholder]="'login.emailPlaceholder' | translate:'Auth'"
          autocomplete="email"
          />
        </div>

        @if (errorMessage) {
          <div class="error-message">
            {{ errorMessage }}
          </div>
        }

        @if (successMessage) {
          <div class="success-message">
            {{ successMessage }}
          </div>
        }

        <button type="submit" class="submit-button" [disabled]="isLoading">
          {{ isLoading ? ('forgotPassword.sending' | translate:'Auth') : ('forgotPassword.sendResetLink' | translate:'Auth') }}
        </button>
      </form>

      <div class="footer-links">
        <a routerLink="/login" class="link">{{ 'forgotPassword.backToLogin' | translate:'Auth' }}</a>
      </div>
    </div>
  </div>
