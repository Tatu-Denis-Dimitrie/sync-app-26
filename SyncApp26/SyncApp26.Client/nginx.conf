server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Matches the API's [RequestSizeLimit(100 * 1024 * 1024)] on CsvSyncController uploads — nginx's
    # default (1m) would otherwise reject large CSV imports with 413 before they ever reach the backend.
    client_max_body_size 100m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_proxied any;

    # SPA fallback: Angular Router (real router with a "**" wildcard) needs every non-file,
    # non-API, non-hub path to resolve to index.html so deep-links/refreshes don't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the backend container — keeps the browser same-origin with the SPA,
    # satisfying the inline CSP's connect-src 'self' and matching dev's proxy.conf.json behavior.
    # "api" resolves via the compose network's embedded DNS (the backend service's name).
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SignalR hub — needs explicit WebSocket upgrade headers, which proxy.conf.json's `ws: true`
    # provides implicitly in dev.
    location /hubs/ {
        proxy_pass http://api:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
